<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#C62828">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>نظام كاشير المطعم SHIFA</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<link rel="icon" href="logo.png" type="image/png">
<style>
  *{box-sizing:border-box}
.edit-btn{background:#4CAF50;color:white;border:none;padding:3px 8px;border-radius:4px;font-size:12px;margin:2px;cursor:pointer}
.delete-btn{background:#f44336;color:white;border:none;padding:3px 8px;border-radius:4px;font-size:12px;margin:2px;cursor:pointer}
  body{font-family:'Tahoma';background:#f5f5f5;margin:0;padding:0}
.activate-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;justify-content:center;align-items:center;z-index:9999}
.activate-box{background:#fff;padding:30px;border-radius:10px;text-align:center;width:300px;max-width:90%}
.activate-box input{width:90%;padding:10px;margin:10px 0;font-size:18px;text-align:center}
.activate-box button{background:#D32F2F;color:#fff;border:none;padding:10px 20px;border-radius:5px;cursor:pointer;font-size:16px;width:100%}
.error{color:red;margin-top:10px}
.header{background:#D32F2F;color:#fff;padding:15px;text-align:center;font-size:18px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.lang-btn{background:#fff;color:#D32F2F;border:none;padding:5px 10px;border-radius:5px;cursor:pointer;margin:0 2px}
.tabs{display:flex;background:#fff;border-bottom:2px solid #D32F2F;overflow-x:auto}
.tab{padding:12px 20px;cursor:pointer;white-space:nowrap}
.tab.active{background:#D32F2F;color:#fff}
.container{display:flex;gap:10px;padding:10px;flex-wrap:wrap}
.menu{flex:3;min-width:300px}
.cart{flex:1;background:#fff;padding:10px;border-radius:8px;min-width:250px}
.item{border:1px solid #ddd;padding:10px;margin:5px;border-radius:8px;cursor:pointer;text-align:center;width:48%;min-width:140px;position:relative;background:#fff;display:inline-block;vertical-align:top}
@media(min-width:768px){.item{width:23%}}
.item.soldout{opacity:0.6;background:#FFEBEE}
.item img{width:100%;height:100px;object-fit:cover;border-radius:5px;background:#f0f0f0}
.cart-item{display:flex;justify-content:space-between;align-items:center;margin:5px 0;border-bottom:1px dashed #ccc;padding:3px;flex-wrap:wrap}
.btn-del{background:#f44336;color:#fff;border:none;padding:3px 8px;border-radius:3px;cursor:pointer}
.btn{background:#D32F2F;color:#fff;border:none;padding:10px;width:100%;border-radius:5px;font-size:15px;margin-top:6px;cursor:pointer}
.btn.green{background:#4CAF50}.btn.blue{background:#2196F3}.btn.yellow{background:#FFC107;color:#000}
.total{font-size:22px;font-weight:bold;color:#D32F2F;text-align:center;margin:10px 0}
.manage{display:none;background:#fff;padding:10px;margin:10px;border-radius:8px}
.soldout-btn{position:absolute;top:2px;left:2px;background:#000;color:#fff;font-size:10px;padding:2px 5px;border-radius:3px;cursor:pointer;z-index:2}
</style>
</head>
<body>

<div class="activate-screen" id="activateScreen">
  <div class="activate-box">
    <img src="logo.png" style="width:80px;margin-bottom:10px;border-radius:10px">
    <h2>🔒 تفعيل نظام الكاشير</h2>
    <input type="text" id="licenseKey" placeholder="XXXX-XXXX-XXXX">
    <button onclick="checkLicense()">تفعيل</button>
    <div class="error" id="errorMsg"></div>
    <p style="font-size:12px;color:#666">الكود: SHIFA-2026-CASH</p>
  </div>
</div>

<div id="mainApp" style="display:none">
<div class="header">
  <span id="title">نظام كاشير المطعم</span>
  <div>
    <button class="lang-btn" onclick="setLang('ar')">عربي</button>
    <button class="lang-btn" onclick="setLang('ku')">کوردی</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
    <button class="lang-btn" onclick="logout()" style="background:#000;color:#fff">خروج</button>
    <span onclick="toggleManage()" style="cursor:pointer;font-size:24px">⚙️</span>
  </div>
</div>

<div class="tabs" id="tabs"></div>

<div class="manage" id="managePanel">
  <h3 id="manageTitle">ادارة المنيو</h3>
  <div id="manageList"></div>
</div>

<div class="container">
  <div class="menu">
    <h3 id="menuTitle">المنيو - اضغط للاضافة</h3>
    <div id="menuList"></div>
  </div>
  <div class="cart">
    <h3 id="cartTitle">السلة</h3>
    <label id="tableLabel">رقم الطاولة:</label>
    <select id="tableNum"></select>
    <div id="cartList"></div>
    <label id="discountLabel">خصم سريع:</label>
    <button class="btn yellow" onclick="discount(0)">0%</button>
    <button class="btn yellow" onclick="discount(10)">10%</button>
    <button class="btn yellow" onclick="discount(20)">20%</button>
    <div class="total"><span id="totalLabel">المجموع</span>: <span id="total">0</span> <span id="currency">د.ع</span></div>
    <button class="btn" id="printBtn" onclick="printBill()">🖨️ طباعة فاتورة</button>
    <button class="btn green" id="saveBtn" onclick="newBill()">💾 فاتورة جديدة</button>
    <button class="btn blue" id="reportBtn" onclick="dailyReport()">📊 التقرير اليومي</button>
  </div>
</div>
</div>

<script>
const VALID_KEY = "SHIFA-2026-CASH";
function checkLicense(){
  if(document.getElementById('licenseKey').value.toUpperCase() == VALID_KEY){
    localStorage.setItem('activated', 'true');
    document.getElementById('activateScreen').style.display='none';
    document.getElementById('mainApp').style.display='block';
  } else {document.getElementById('errorMsg').innerText = 'كود خطأ ❌';}
}
function logout(){localStorage.removeItem('activated');location.reload();}
window.onload = function(){
  if(localStorage.getItem('activated') == 'true'){
    document.getElementById('activateScreen').style.display='none';
    document.getElementById('mainApp').style.display='block';
  }
  setLang('ar');
}
const translations = {
  ar: {title:"نظام كاشير المطعم",menu:"المنيو - اضغط للاضافة",cart:"السلة",table:"رقم الطاولة:",discount:"خصم سريع:",total:"المجموع",currency:"د.ع",print:"🖨️ طباعة فاتورة",save:"💾 فاتورة جديدة",report:"📊 التقرير اليومي",manage:"ادارة المنيو",all:"الكل",meals:"وجبات",iraqi:"عراقي",app:"مقبلات",drink:"مشروبات",sweet:"حلويات",offer:"عروض",safari:"سفري",table1:"طاولة 1",table2:"طاولة 2",edit:"تعديل",delete:"حذف",out:"نفذت"},
  ku: {title:"سیستمی کاشێری چێشتخانە",menu:"مینۆ",cart:"سەبەتە",table:"ژمارەی مێز:",discount:"داشکاندن:",total:"کۆی",currency:"د.ع",print:"🖨️ چاپ",save:"💾 نوێ",report:"📊 ڕاپۆرت",manage:"بەڕێوەبردن",all:"هەموو",meals:"خواردن",iraqi:"عێراقی",app:"پێشخواردن",drink:"خواردنەوە",sweet:"شیرینی",offer:"ئۆفەر",safari:"بۆ ماڵ",table1:"مێز 1",table2:"مێز 2",edit:"دەستکاری",delete:"سڕینەوە",out:"تەواو"},
  en: {title:"Restaurant Cashier",menu:"Menu - Click to Add",cart:"Cart",table:"Table:",discount:"Discount:",total:"Total",currency:"IQD",print:"🖨️ Print",save:"💾 New Bill",report:"📊 Report",manage:"Manage",all:"All",meals:"Meals",iraqi:"Iraqi",app:"Appetizers",drink:"Drinks",sweet:"Desserts",offer:"Offers",safari:"Takeaway",table1:"Table 1",table2:"Table 2",edit:"Edit",delete:"Delete",out:"Sold Out"}
};
let currentLang = 'ar';
let menu = JSON.parse(localStorage.getItem('menu')) || [
  {name:{ar:'كباب',ku:'کەباب',en:'Kebab'},price:12000,cat:'عراقي',qty:0,soldout:false,img:'https://via.placeholder.com/150/D32F2F/FFFFFF?text=كباب'},
  {name:{ar:'برجر',ku:'بەرگەر',en:'Burger'},price:10000,cat:'وجبات',qty:0,soldout:false,img:'https://via.placeholder.com/150/D32F2F/FFFFFF?text=برگر'},
  {name:{ar:'بيتزا',ku:'پیتزا',en:'Pizza'},price:12000,cat:'وجبات',qty:0,soldout:false,img:'https://via.placeholder.com/150/D32F2F/FFFFFF?text=Pizza'},
  {name:{ar:'بطاطا',ku:'پەتاتە',en:'Fries'},price:3000,cat:'مقبلات',qty:0,soldout:false,img:'https://via.placeholder.com/150/D32F2F/FFFFFF?text=Fries'},
  {name:{ar:'بيبسي',ku:'پێپسی',en:'Pepsi'},price:1000,cat:'مشروبات',qty:0,soldout:false,img:'https://via.placeholder.com/150/D32F2F/FFFFFF?text=Pepsi'}
]
let cart = {};let currentDiscount = 0;let currentCat = 'all';

function setLang(lang){currentLang=lang;document.body.dir = lang=='en'?'ltr':'rtl';let t=translations[lang];
document.getElementById('title').innerText=t.title;document.getElementById('menuTitle').innerText=t.menu;
document.getElementById('cartTitle').innerText=t.cart;document.getElementById('tableLabel').innerText=t.table;
document.getElementById('discountLabel').innerText=t.discount;document.getElementById('totalLabel').innerText=t.total;
document.getElementById('currency').innerText=t.currency;document.getElementById('printBtn').innerText=t.print;
document.getElementById('saveBtn').innerText=t.save;document.getElementById('reportBtn').innerText=t.report;
document.getElementById('manageTitle').innerText=t.manage;
document.getElementById('tabs').innerHTML=`<div class="tab active" onclick="filterCat('all',this)">${t.all}</div><div class="tab" onclick="filterCat('وجبات',this)">${t.meals}</div><div class="tab" onclick="filterCat('عراقي',this)">${t.iraqi}</div><div class="tab" onclick="filterCat('مقبلات',this)">${t.app}</div><div class="tab" onclick="filterCat('مشروبات',this)">${t.drink}</div><div class="tab" onclick="filterCat('حلويات',this)">${t.sweet}</div>`;
document.getElementById('tableNum').innerHTML=`<option>${t.safari}</option><option>${t.table1}</option><option>${t.table2}</option>`;renderMenu();}

function filterCat(cat, el){currentCat = cat;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');renderMenu();}
function renderMenu(items = menu){
  let html='';items.filter(i=>currentCat=='all'||i.cat==currentCat).forEach((i)=>{
    let realIndex = menu.indexOf(i);
    html+=`<div class="item ${i.soldout?'soldout':''}" onclick="addToCart(${realIndex})">
      <span class="soldout-btn" onclick="toggleSoldout(${realIndex});event.stopPropagation()">${translations[currentLang].out}</span>
      <img src="${i.img}">
      <div><b>${i.name[currentLang]}</b></div>
      <div>${i.price} ${translations[currentLang].currency}</div>
      <button onclick="editPrice(${realIndex});event.stopPropagation()" class="edit-btn">${translations[currentLang].edit}</button>
      <button onclick="deleteItem(${realIndex});event.stopPropagation()" class="delete-btn">${translations[currentLang].delete}</button>
    </div>`;});
  document.getElementById('menuList').innerHTML=html;}
function addToCart(i){let name=menu[i].name[currentLang];if(!cart[name]) cart[name]={...menu[i],qty:1};else cart[name].qty++;updateCart();}
function updateCart(){let html=''; let total=0;for(let name in cart){let item=cart[name];total+=item.price*item.qty;
html+=`<div class="cart-item"><span>${name} x${item.qty}</span><span>${item.price*item.qty} ${translations[currentLang].currency}</span>
<span><button onclick="changeQty('${name}',-1)">-</button><button onclick="changeQty('${name}',1)">+</button>
<button class="btn-del" onclick="deleteCartItem('${name}')">${translations[currentLang].delete}</button></span></div>`;}
document.getElementById('cartList').innerHTML=html;let finalTotal = total - (total*currentDiscount/100);
document.getElementById('total').innerText = finalTotal;}
function deleteItem(index){if(confirm("تحذف " + menu[index].name[currentLang] + " ؟")){menu.splice(index, 1);localStorage.setItem('menu', JSON.stringify(menu));renderMenu();}}
function deleteCartItem(name){delete cart[name];updateCart();}
function changeQty(name,d){cart[name].qty+=d; if(cart[name].qty<=0) delete cart[name]; updateCart();}
function discount(p){currentDiscount=p; updateCart();}
function toggleManage(){let x=document.getElementById('managePanel');x.style.display = x.style.display=='none'?'block':'none';}
function toggleSoldout(i){menu[i].soldout=!menu[i].soldout; saveMenu();}
function saveMenu(){localStorage.setItem('menu',JSON.stringify(menu)); renderMenu();}
function printBill(){window.print();}
function newBill(){cart={};currentDiscount=0;updateCart();}
function dailyReport(){alert('التقرير اليومي: ' + Object.keys(cart).length + ' اصناف')}
function editPrice(index){let newPrice = prompt("السعر الجديد:", menu[index].price);if(newPrice &&!isNaN(newPrice)){menu[index].price = parseInt(newPrice);saveMenu();}}
</script>
</body>
</html>
